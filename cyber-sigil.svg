<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyber metallic glow -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8a99ad" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- 4-point Y2K star symbol -->
    <g id="y2k-star">
      <path d="M 0,-45 Q 0,0 45,0 Q 0,0 0,45 Q 0,0 -45,0 Q 0,0 0,-45 Z" fill="url(#chrome)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Sharp neo-tribal thorn segment -->
    <g id="sigil-branch">
      <path d="M 0,0 C 30,-50 90,-90 160,-100 C 130,-70 120,-30 140,20 C 100,0 60,-10 0,0 Z" fill="url(#chrome)"/>
      <path d="M 70,-40 C 120,-120 220,-170 320,-190 C 270,-150 250,-90 270,-20 C 220,-60 140,-60 70,-40 Z" fill="url(#chrome)"/>
      <path d="M 140,-80 Q 240,-130 360,-140 Q 280,-100 240,-40 Q 180,-70 140,-80 Z" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    </g>
  </defs>

  <!-- Faint tech-grid backdrop -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.75">
    <line x1="0" y1="250" x2="1000" y2="250" stroke-dasharray="4,8"/>
    <line x1="0" y1="500" x2="1000" y2="500" stroke-dasharray="2,6"/>
    <line x1="0" y1="750" x2="1000" y2="750" stroke-dasharray="4,8"/>
    <line x1="250" y1="0" x2="250" y2="1000" stroke-dasharray="4,8"/>
    <line x1="500" y1="0" x2="500" y2="1000" stroke-dasharray="2,6"/>
    <line x1="750" y1="0" x2="750" y2="1000" stroke-dasharray="4,8"/>
    <circle cx="500" cy="500" r="380" stroke-dasharray="6,6"/>
    <circle cx="500" cy="500" r="220" stroke-dasharray="2,4"/>
  </g>

  <!-- Central Cyber Sigil Emblem -->
  <g transform="translate(500, 500)">
    <!-- 4-way mirrored neo-tribal thorns -->
    <use href="#sigil-branch" />
    <use href="#sigil-branch" transform="scale(-1, 1)" />
    <use href="#sigil-branch" transform="scale(1, -1)" />
    <use href="#sigil-branch" transform="scale(-1, -1)" />
    
    <use href="#sigil-branch" transform="rotate(90) scale(0.7)" />
    <use href="#sigil-branch" transform="rotate(90) scale(-0.7, 0.7)" />
    <use href="#sigil-branch" transform="rotate(90) scale(0.7, -0.7)" />
    <use href="#sigil-branch" transform="rotate(90) scale(-0.7, -0.7)" />

    <!-- Center gothic ring spike -->
    <circle cx="0" cy="0" r="60" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" stroke="url(#chrome)" stroke-width="3" stroke-dasharray="10, 15"/>
    <use href="#y2k-star" transform="scale(1.4)"/>
  </g>

  <!-- Floating accent Y2K stars & thorns -->
  <use href="#y2k-star" transform="translate(180, 180) scale(0.9) rotate(15)"/>
  <use href="#y2k-star" transform="translate(820, 200) scale(0.7) rotate(-20)"/>
  <use href="#y2k-star" transform="translate(150, 780) scale(0.8) rotate(-10)"/>
  <use href="#y2k-star" transform="translate(850, 820) scale(1.1) rotate(25)"/>
  <use href="#y2k-star" transform="translate(500, 120) scale(0.6)"/>
  <use href="#y2k-star" transform="translate(500, 880) scale(0.6)"/>
</svg>
